# OwnHealth for a homelab: the app and Postgres behind Caddy with HTTPS, secrets kept in files,
# restic backups from a one-off admin container. Steps: deploy/README.md.
#
# Copy this file to compose.yaml in its own folder, next to Caddyfile, .env, restic.env, secrets/ and deploy/.
name: ownhealth

# Two database roles. `ownhealth` owns the tables: the one-shot `admin` service uses it to migrate, to
# restore, and to grant the app its rows (deploy/db/app-role.sql). The app connects as `ownhealth_app`,
# which owns nothing, so it cannot ALTER a table, disable a trigger, or rewrite the audit log.
services:
  admin:
    image: drumsergio/ownhealth:0.3.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - path: restic.env # RESTIC_REPOSITORY, and S3 keys for restic: the admin service only
        required: false # older installs keep them in .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD_FILE: /run/secrets/db_password
      OWNHEALTH_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      OWNHEALTH_SECRET_KEY_FILE: /run/secrets/secret_key
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    command: ["sh", "-c", "ownhealth migrate && sh /opt/ownhealth-db/app-role.sh"]
    healthcheck:
      disable: true
    secrets: [db_password, app_db_password, secret_key, restic_password]
    volumes:
      - ownhealth-data:/data # blobs, and /data/backups for the restic staging directory
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  app:
    image: drumsergio/ownhealth:0.3.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    env_file: .env # never restic.env: a compromised app must not reach the backups
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth_app@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD_FILE: /run/secrets/app_db_password
      OWNHEALTH_RUN_MIGRATIONS: "0" # the admin service migrated as the owner
      OWNHEALTH_SECRET_KEY_FILE: /run/secrets/secret_key
      OWNHEALTH_SECRETS_KEY_FILE: /run/secrets/secrets_key # seals inbox passwords and tokens (v0.2)
      OWNHEALTH_BASE_URL: https://${OWNHEALTH_DOMAIN:?set OWNHEALTH_DOMAIN in .env}
      OWNHEALTH_INBOX_DIR: /inbox # the watched folder: ./inbox/<profile>/ on the host
    secrets: [app_db_password, secret_key, secrets_key]
    volumes:
      - ownhealth-data:/data
      - ./inbox:/inbox
    # No published port: only Caddy reaches the app, on the compose network.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # `ocr` profile (v0.2): reads scans and photos with the local OCR engine. Turn it on with two lines
  # in .env: COMPOSE_PROFILES=ocr (starts this worker) and OWNHEALTH_OCR=1 (the app sends unread pages
  # to the `ocr` queue instead of leaving them pending). It serves no HTTP and only runs `ocr` jobs.
  ocr:
    profiles: [ocr]
    image: drumsergio/ownhealth:0.3.0-ocr
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    env_file: .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth_app@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD_FILE: /run/secrets/app_db_password
      OWNHEALTH_RUN_MIGRATIONS: "0"
      OWNHEALTH_SECRET_KEY_FILE: /run/secrets/secret_key
      OWNHEALTH_QUEUES: ocr
    command: ["ownhealth", "worker"]
    healthcheck:
      disable: true # a worker serves no /healthz
    secrets: [app_db_password, secret_key]
    volumes:
      - ownhealth-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ownhealth
      POSTGRES_DB: ownhealth
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownhealth -d ownhealth"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ownhealth-pg:/var/lib/postgresql/data

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    depends_on: [app]
    environment:
      OWNHEALTH_DOMAIN: ${OWNHEALTH_DOMAIN:?set OWNHEALTH_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  db_password:
    file: ./secrets/db_password # the owner role's password (migrations, backups, restores)
  app_db_password:
    file: ./secrets/app_db_password # the app role's password
  secret_key:
    file: ./secrets/secret_key
  secrets_key:
    file: ./secrets/secrets_key # inbox credentials at rest; keep a copy with the restic password
  restic_password:
    file: ./secrets/restic_password # keep a copy in your password manager: without it the backup is useless

volumes:
  ownhealth-data:
  ownhealth-pg:
  caddy-data:
  caddy-config:
