[package]
name = "ownhealth"
description = "OwnHealth: a personal health record. One binary: the web app, the MCP server and the job workers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ownhealth"
path = "src/main.rs"

[dependencies]
ownhealth-api.workspace = true
ownhealth-auth.workspace = true
ownhealth-core.workspace = true
ownhealth-genome.workspace = true
ownhealth-ingest-pdf.workspace = true
ownhealth-ingest-structured.workspace = true
ownhealth-mcp.workspace = true
ownhealth-normalize.workspace = true
ownhealth-ops.workspace = true
ownhealth-rules.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
http.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ownhealth-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tower.workspace = true
