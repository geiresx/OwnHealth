system: liver
order: 2
names: {en: Liver, es: Hígado}
markers: [alt, ggt, ast]
rules:
  - id: recency.liver
    kind: recency
    match: [alt, ggt, ast]
    window_days: 365
    cite: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/architecture.md#11-current-state-the-deterministic-rule-pack
    basis: pack_default
  - id: rcv.alt
    kind: rcv
    match: [alt]
    cv_i: "9.3"
    cv_a: "6.7"
    cite: https://doi.org/10.1515/cclm-2021-0370
    primary: https://doi.org/10.1373/clinchem.2016.269811
    note: EuBIVAS, ALT on an ADVIA 2400; CVi 9.3% (8.7-10.0), CVa 6.7%.
