system: thyroid
order: 4
names: {en: Thyroid, es: Tiroides}
markers: [tsh, ft4]
rules:
  - id: recency.thyroid
    kind: recency
    match: [tsh, ft4]
    window_days: 365
    cite: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/architecture.md#11-current-state-the-deterministic-rule-pack
    basis: pack_default
    note: architecture.md section 16 fixes TSH at 12 months for the shipped pack.
  - id: rcv.tsh
    kind: rcv
    match: [tsh]
    cv_i: "18.9"
    cv_a: "1.46"
    cite: https://doi.org/10.1515/cclm-2021-0370
    primary: https://doi.org/10.1515/cclm-2020-1885
    note: EuBIVAS, TSH on a Roche Cobas e801; CVi 18.9% (17.5-20.5), CVa 1.46% in the summary table (the primary paper's abstract gives CVi 17.7%).
