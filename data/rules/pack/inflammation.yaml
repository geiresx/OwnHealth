system: inflammation
order: 6
names: {en: Inflammation, es: Inflamación}
markers: [crp_hs]
rules:
  - id: recency.crp_hs
    kind: recency
    match: [crp_hs]
    window_days: 365
    cite: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/architecture.md#11-current-state-the-deterministic-rule-pack
    basis: pack_default
  - id: rcv.crp_hs
    kind: rcv
    match: [crp_hs]
    cv_i: "29.4"
    cv_a: "11.1"
    cite: https://doi.org/10.1515/cclm-2021-0370
    primary: https://doi.org/10.1373/clinchem.2019.304618
    note: EuBIVAS, CRP on a Roche Cobas c702 (mean 0.72 mg/L); CVi 29.4% (27.6-31.1), CVa 11.1%.
