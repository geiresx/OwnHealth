system: cardiometabolic
order: 1
names: {en: Cardiometabolic, es: Cardiometabólico}
markers: [ldl_c, lpa, apob, hba1c, glucose]
rules:
  - id: recency.lipids
    kind: recency
    match: [ldl_c, apob]
    window_days: 365
    cite: https://doi.org/10.1093/eurheartj/ehz455
    note: ESC/EAS 2019 dyslipidaemia guideline, monitoring of lipids; the 12-month window is the pack's reading of it.
  - id: recency.hba1c
    kind: recency
    match: [hba1c]
    window_days: 183
    cite: https://diabetesjournals.org/care/issue/49/Supplement_1
    note: ADA Standards of Care, A1C at least twice a year.
  - id: recency.glucose
    kind: recency
    match: [glucose]
    window_days: 365
    cite: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/architecture.md#11-current-state-the-deterministic-rule-pack
    basis: pack_default
  # Lp(a) is largely genetic and measured once in adult life, so it has no recency window.
  # CVi and CVa from the EuBIVAS summary report, Table 2 (cite), measured in the primary study (primary).
  # HbA1c has no EuBIVAS estimate we may ship, so it has no RCV. An install can add one in its override directory (OWNHEALTH_RULES_OVERRIDE_DIR), which makes the version end in +local.
  - id: rcv.ldl_c
    kind: rcv
    match: [ldl_c]
    cv_i: "8.46"
    cv_a: "1.77"
    cite: https://doi.org/10.1515/cclm-2021-0370
    primary: https://doi.org/10.1373/clinchem.2018.288415
    note: EuBIVAS, 91 healthy adults, 10 weekly samples, LDL cholesterol on an ADVIA 2400; CVi 8.46% (8.05-8.94), CVa 1.77%.
  - id: trend.hba1c.rise
    kind: trend
    match: [hba1c]
    points: 3
    direction: up
    min_slope_per_year: "0.1"
    cite: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/architecture.md#11-current-state-the-deterministic-rule-pack
    basis: pack_default
