<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OwnHealth · clickable mockup</title>
<style>
:root{
  --bg:#0f1115;--surface:#161a21;--raised:#1d222c;--hover:#232937;--line:#2a303c;--line2:#343b49;
  --text:#e6e8ee;--muted:#9aa3b2;--dim:#7a8394;
  --accent:#6ea8fe;--accent-bg:rgba(110,168,254,.13);
  --ok:#3fb68b;--ok-bg:rgba(63,182,139,.14);
  --watch:#e0a84a;--watch-bg:rgba(224,168,74,.14);
  --out:#ef6b73;--out-bg:rgba(239,107,115,.14);
  --stale:#9aa3b2;--stale-bg:rgba(154,163,178,.13);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
/* sidebar */
.side{background:#12151b;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:10px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 8px;font-weight:650;font-size:15px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:0}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent-bg);display:grid;place-items:center}
.plabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:6px 8px 2px}
.profiles{display:flex;flex-direction:column;gap:2px}
.prof{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%}
.prof:hover{background:var(--hover)}
.prof.on{background:var(--raised);border-color:var(--line2)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:650;color:#0f1115;flex:none}
.prof .nm{font-size:12.5px;line-height:1.2}.prof .rl{font-size:11px;color:var(--dim)}
.prof .bdg{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:9px;background:var(--watch-bg);color:var(--watch)}
nav.menu{display:flex;flex-direction:column;gap:1px}
nav.menu a{display:flex;align-items:center;gap:10px;color:var(--muted);padding:7px 9px;border-radius:8px;font-size:13px}
nav.menu a:hover{background:var(--hover);color:var(--text)}
nav.menu a.on{background:var(--accent-bg);color:var(--text)}
nav.menu a.on svg{stroke:var(--accent)}
nav.menu svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
nav.menu .cnt{margin-left:auto;font-size:10.5px;background:var(--watch-bg);color:var(--watch);padding:0 6px;border-radius:9px}
.side .foot{margin-top:auto;font-size:11px;color:var(--dim);padding:8px;border-top:1px solid var(--line);line-height:1.5}
/* top bar */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(15,17,21,.9)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:34px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit}
.kbd{font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--dim)}
.asof{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.asof b{color:var(--text);font-weight:550}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent-bg);color:var(--text)}
.top .sp{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.view{flex:1;overflow:auto;padding:18px 22px 22px}
/* generic */
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.ph h1{font-size:20px;font-weight:620;margin:0;letter-spacing:-.1px}
.ph .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:620;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:560;padding:1px 8px 1px 6px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.p-ok{color:var(--ok);background:var(--ok-bg)}.p-watch{color:var(--watch);background:var(--watch-bg)}
.p-out{color:var(--out);background:var(--out-bg)}.p-stale{color:var(--stale);background:var(--stale-bg)}
.p-info{color:var(--accent);background:var(--accent-bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;background:transparent}
.chip.on{border-color:var(--accent);color:var(--text);background:var(--accent-bg)}
button.chip{padding:3px 9px;font-size:12px}
.src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);white-space:nowrap;cursor:pointer}
.src:hover{color:var(--accent)}
.src svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn{white-space:nowrap;background:var(--raised);border:1px solid var(--line2);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0c1222;font-weight:600}
.btn.sm{padding:2px 8px;font-size:11.5px}
.btn.ok{color:var(--ok)}.btn.no{color:var(--out)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t.nw td,.t.nw th{white-space:nowrap;padding:6px 7px}
.t th{text-align:left;font-weight:520;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.t td{padding:6px 8px;border-bottom:1px solid #20252f;vertical-align:middle}
.t tr:hover td{background:#1a1f28}
.phase{white-space:nowrap;font-size:10.5px;color:var(--accent);border:1px solid rgba(110,168,254,.35);border-radius:5px;padding:0 6px;font-weight:550}
.note{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r);border:1px solid rgba(224,168,74,.4);background:linear-gradient(90deg,rgba(224,168,74,.12),rgba(224,168,74,.04));margin-bottom:12px}
.foot-hash{margin-top:14px;display:flex;gap:16px;color:var(--dim);font-size:11px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.foot-hash .mono{font-size:11px;color:var(--muted)}
.grid{display:grid;gap:12px}
/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.meds{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;flex-wrap:nowrap;overflow:hidden}
.med{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;background:var(--raised);border-radius:8px;white-space:nowrap}
.med b{font-weight:560}
.pgx{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:5px;border:1px solid}
.sys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px 9px;display:flex;flex-direction:column}
.sc .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sc .hd b{font-size:13px;font-weight:620}
.sc .hd .pill{margin-left:auto}
.mk{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n v" "s g";align-items:center;column-gap:8px;padding:5px 0 4px;border-top:1px solid #20252f}
.mk .n{grid-area:n;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mk .v{grid-area:v}.mk .s{grid-area:s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1}.mk .g{grid-area:g;text-align:right;line-height:0}
.mk:first-of-type{border-top:0}
.mk .n{font-size:12.5px;line-height:1.15}
.mk .v{font-size:14px;font-weight:600;text-align:right;line-height:1.1}
.mk .v small{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:2px}
.stale-b{font-size:10px;padding:0 5px;border-radius:4px;color:var(--stale);border:1px dashed var(--stale);margin-left:5px;vertical-align:1px}
.sc .ft{margin-top:auto;padding-top:6px;gap:8px;white-space:nowrap;font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between}
.chg{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;font-size:12.5px}
.arrow-up{color:var(--out)}.arrow-dn{color:var(--ok)}
.due{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #20252f}
.due:first-of-type{border-top:0}
.due .ic{width:26px;height:26px;border-radius:7px;background:var(--raised);display:grid;place-items:center;flex:none}
.due .ic svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.7}
.due .w{flex:1;min-width:0}.due .w div:last-child{font-size:11px;color:var(--dim)}
.review{display:flex;align-items:center;gap:12px}
.review .big{font-size:28px;font-weight:650;color:var(--watch);line-height:1}
/* biomarker */
.bm{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}
.kv{display:flex;align-items:baseline;gap:6px}
.kv .big{font-size:30px;font-weight:650;line-height:1}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.calc{border-top:1px solid #20252f;padding:8px 0}
.calc:first-of-type{border-top:0}
.calc .row{display:flex;align-items:baseline;gap:8px}
.calc .val{margin-left:auto;font-size:17px;font-weight:650}
/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters .lab{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.yr{font-size:12px;font-weight:650;color:var(--muted);margin:10px 0 4px 74px}
.ev{display:grid;grid-template-columns:62px 24px 1fr;gap:0 12px;position:relative}
.ev .dt{font-size:11.5px;color:var(--muted);text-align:right;padding-top:9px}
.ev .rail{position:relative}
.ev .rail:before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
.ev .dot{position:absolute;left:3px;top:8px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg)}
.ev .dot svg{width:10px;height:10px;stroke:#0f1115;fill:none;stroke-width:2.4}
.ev .body{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 12px;margin:3px 0;display:flex;gap:12px;align-items:center}
.ev .body .t1{font-weight:580}
.ev .body .t2{font-size:11.5px;color:var(--muted)}
.ev .body .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.flag{font-size:10.5px;font-weight:650;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--muted)}
/* genome */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.tile .n{font-size:22px;font-weight:650;margin:2px 0}
.tile .d{font-size:11.5px;color:var(--muted)}
.ev-E1{color:var(--ok);border-color:rgba(63,182,139,.5)}.ev-E2{color:#8fd3b8;border-color:rgba(143,211,184,.4)}
.ev-E3{color:var(--watch);border-color:rgba(224,168,74,.45)}.ev-E4{color:var(--stale);border-color:var(--line2)}
.lock{background:repeating-linear-gradient(135deg,#1a1e26 0 8px,#181c23 8px 16px)}
/* drug */
.drug{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);background:#141a26;border-radius:0 8px 8px 0;color:#d5dae4}
.disc{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--accent-bg);border:1px solid rgba(110,168,254,.35);margin-top:12px}
/* wearables */
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.devs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.dev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;display:flex;gap:10px;align-items:center}
.bar{height:6px;border-radius:3px;background:#262c38;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
/* imaging */
.img{display:grid;grid-template-columns:250px 1fr 330px;gap:12px;height:calc(100vh - 52px - 40px - 52px)}
.study{padding:9px 10px;border-radius:8px;border:1px solid transparent}
.study.on{background:var(--raised);border-color:var(--line2)}
.viewer{background:#000;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.vtool{display:flex;gap:4px;padding:6px 8px;background:#0b0c0f;border-bottom:1px solid #1d2028}
.vtool span{font-size:11px;color:#aeb5c2;padding:3px 8px;border-radius:5px;background:#16181d}
.vtool span.on{background:#253047;color:#cfe0ff}
.thumbs{display:flex;gap:6px;padding:8px;background:#0b0c0f;border-top:1px solid #1d2028}
.thumbs div{width:84px;border:1px solid #2a2f3a;border-radius:5px;overflow:hidden;font-size:10px;color:#9aa3b2;text-align:center}
.thumbs div.on{border-color:var(--accent)}
/* import */
.imp{display:grid;grid-template-columns:430px minmax(0,1fr);gap:12px}
.inbox{display:flex;gap:8px;margin-bottom:12px}
.ib{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;display:flex;align-items:center;gap:9px}
.ib .c{margin-left:auto;font-weight:650}
.page{background:#f4f2ee;color:#222;border-radius:4px;padding:18px 22px;font-family:Georgia,"Times New Roman",serif;font-size:11px;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.45);height:570px;overflow:hidden}
.page table{width:100%;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:10.5px}
.page td,.page th{padding:3px 4px;border-bottom:1px solid #ddd;text-align:left}
.page th{border-bottom:1.5px solid #666;font-size:9.5px;text-transform:uppercase;color:#444}
.bb{outline:2px solid rgba(110,168,254,.9);background:rgba(110,168,254,.16)}
.bb-w{outline:2px solid rgba(224,168,74,.95);background:rgba(224,168,74,.2)}
.bb-a{outline:2px dashed rgba(110,168,254,.95);background:rgba(110,168,254,.08)}
.bb-x{outline:2px solid rgba(239,107,115,.95);background:rgba(239,107,115,.14)}
.xr{display:grid;grid-template-columns:20px minmax(0,1.1fr) minmax(0,1.25fr) minmax(0,1.2fr) 88px 118px;gap:4px 8px;align-items:center;padding:6px 10px;border-bottom:1px solid #20252f;font-size:12.3px}
.xr.h{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);padding:6px 10px}
.xr.low{background:rgba(224,168,74,.07)}
.xr.agent{background:rgba(110,168,254,.07)}
.xr.bad{background:rgba(239,107,115,.08)}
.conf{display:flex;align-items:center;gap:5px;font-size:11.5px}
.conf .bar{width:38px}
.acts{display:flex;gap:4px}
/* family */
.fam{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center}
.gm td,.gm th{text-align:center}.gm td:first-child,.gm th:first-child{text-align:left}
.sw{width:30px;height:17px;border-radius:9px;background:var(--accent);position:relative;flex:none}
.sw:after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#0f1115}
.sw.off{background:#3a4150}.sw.off:after{left:2px;right:auto;background:#9aa3b2}
.set{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #20252f}
.set:first-of-type{border-top:0}
/* mcp */
.mcp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
pre.code{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:break-word;color:#cfd6e3}
.tool{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid #20252f}
.tool:first-of-type{border-top:0}
.tool code{color:var(--text);font-size:12px}
.meter{height:10px;border-radius:5px;background:#262c38;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.tip{position:fixed;pointer-events:none;background:#0b0d11;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:11.5px;display:none;z-index:9;max-width:280px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6ea8fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
      <div>OwnHealth<small>self-hosted · v0.1 mockup</small></div>
    </div>
    <div class="plabel" data-i18n="household">Household</div>
    <div class="profiles" id="profiles"></div>
    <div class="plabel" data-i18n="views">Views</div>
    <nav class="menu" id="menu"></nav>
    <div class="foot"><span data-i18n="syn">Synthetic data only.</span><br><span data-i18n="nodx">Information, not diagnosis.</span><br><span class="mono" style="font-size:10.5px">AGPL-3.0-or-later</span></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7a8394" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" data-i18n-ph="search" placeholder="Search values, documents, genes, drugs…">
        <span class="kbd">/</span>
      </div>
      <div class="asof"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9aa3b2" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="asof">As of</span> <b>2026-11-07</b></div>
      <div class="sp"></div>
      <a class="iconbtn" href="#import-review"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e0a84a" stroke-width="2"><path d="M4 4h16v12H4zM4 16l4 4h8l4-4"/></svg><span data-i18n="toreview">To review</span> <b style="color:var(--watch)">7</b></a>

function tsChart({w=380,h=205,series,yMin,yMax,band,ticks,xlabels,bars,fmt=v=>v,refLine,pad=[8,8,20,32]}){

  if(refLine)g+=`<line x1="${pl}" x2="${w-pr}" y1="${sy(refLine)}" y2="${sy(refLine)}" stroke="${C.accent}" stroke-dasharray="4 3" opacity=".7"/>`;
  (xlabels||[]).forEach(([i,l],k,a)=>{const an=k===a.length-1&&!bars?"end":k===0&&!bars?"start":"middle";g+=`<text x="${sx(i)}" y="${h-5}" fill="${C.axis}" font-size="10" text-anchor="${an}">${l}</text>`});

  });
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

}
function wire(){
  document.querySelectorAll("#unit button").forEach(b=>b.onclick=()=>{S.unit=b.dataset.u;render()});
  document.querySelectorAll(".tlt").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.tlTypes.has(k)?S.tlTypes.delete(k):S.tlTypes.add(k);render()});
  document.querySelectorAll(".tlc").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.tlCountries.has(k)?S.tlCountries.delete(k):S.tlCountries.add(k);render()});
  const c=document.getElementById("tlclear");if(c)c.onclick=()=>{S.tlTypes.clear();S.tlCountries.clear();render()};
  const rv=document.getElementById("reveal");if(rv)rv.onclick=()=>{if(confirm("Reveal APOE for Alex? This is a sensitive finding about future risk. The reveal is logged."))S.showApoe=true;render()};
  const hd=document.getElementById("hideapoe");if(hd)hd.onclick=e=>{e.preventDefault();S.showApoe=false;render()};
  const cp=document.getElementById("copy");if(cp)cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(document.getElementById("snip").textContent);cp.textContent="Copied"};
  const svg=document.getElementById("ldl");
  if(svg)svg.querySelectorAll(".pt").forEach(p=>{const r=LDL[+p.dataset.i];p.onmousemove=e=>tip(e,`<b>${cv(r[1])} ${U()}</b> · ${pill(ldlStatus(r[1],r[4]))}<br>${r[0]} · ${r[2]} (${r[3]}) · ${r[7]}<br><span class="dim">printed range ${r[4]} mg/dL · LOINC ${r[5]}</span><br><span style="color:#6ea8fe">open source page ${r[6]} →</span>`);p.onmouseleave=e=>tip(e,null);p.onfocus=()=>{const b=p.getBoundingClientRect();p.onmousemove({clientX:b.right,clientY:b.bottom})};p.onblur=e=>tip(e,null)});
  const key=f=>e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!e.repeat)f()}};
  const rt=location.hash.slice(1)||"dashboard";
  document.querySelectorAll(".sw[role=switch]").forEach((w,i)=>{const k=rt+":"+i;if(k in S.sw){w.classList.toggle("off",!S.sw[k]);w.setAttribute("aria-checked",String(S.sw[k]))}const t=()=>{const off=w.classList.toggle("off");w.setAttribute("aria-checked",String(!off));S.sw[k]=!off};w.onclick=t;w.onkeydown=key(t);const l=w.nextElementSibling&&w.nextElementSibling.querySelector("div");if(l)w.setAttribute("aria-label",l.textContent)});
}
